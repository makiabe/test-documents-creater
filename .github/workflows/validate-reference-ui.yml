name: Validate compact reference UI
on:
  push:
    branches: [feature/reference-ui-v1.1.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - name: Check syntax and preserve content
        run: |
          node --check js/theme.js
          npm test
      - run: npm run test:browser
      - run: node tests/ui.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-ui-results
          path: test-output/
          retention-days: 7
