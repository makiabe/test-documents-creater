name: Validate site help and mascot
on:
  push:
    branches: [main, fix/mascot-and-site-help]
    paths: [index.html, css/site-help.css, js/site-help.js, tests/site-help.test.mjs, .github/workflows/validate-site-help.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check js/site-help.js && npm test && npm run test:resume
      - name: Check local UI and retained state
        run: node tests/site-help.test.mjs
      - name: Wait for published help revision
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for i in $(seq 1 45); do
            if curl -fsSL "https://makiabe.github.io/test-documents-creater/?ui=help1&check=$i" | grep -q 'site-help.js?v=1.2.0-help1'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify the actual Pages URL
        if: github.ref == 'refs/heads/main'
        env:
          TEST_BASE_URL: https://makiabe.github.io/test-documents-creater/?ui=help1
        run: node tests/site-help.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-help-checks
          path: test-output/
          retention-days: 7
