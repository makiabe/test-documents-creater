name: Validate business CV v1.2
on:
  push:
    branches: [main, feature/business-cv-v1.2]
    paths: ['js/**', 'css/**', 'data/**', 'tests/**', index.html, '.github/workflows/upgrade-business-v1.2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: business-cv-v1.2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for file in js/*.js; do node --check "$file"; done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - name: Check content and CV consistency
        run: |
          npm test
          node tests/resume.test.mjs
      - name: Check UI, full exports and CV tables
        run: |
          npm run test:browser
          node tests/ui.test.mjs
          node tests/resume-browser.test.mjs
      - name: Save exact tested source
        if: always()
        run: |
          mkdir -p test-output
          tar -czf test-output/tested-source.tar.gz index.html css js data scripts tests package.json README.md docs assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-cv-v1.2-results
          path: test-output/
          retention-days: 7
