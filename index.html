<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Documents Creator</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js"></script><script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.2/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><header><b>TEST DOCUMENTS CREATOR</b><span>v1.0</span><p>架空の業務ドキュメントを、ブラウザだけでまとめて生成。</p></header><main><section><h2>1. 用途を選ぶ</h2><div class="grid"><label>業種<select id="industry"></select></label><label>職種<select id="job" disabled></select></label><label>業務・利用シーン<select id="scene" disabled></select></label></div></section><section><h2>2. 作成できるドキュメント</h2><div id="documents" class="empty">業務・利用シーンを選択してください。</div></section><section><h2>3. 生成条件</h2><div class="opts"><div><b>ファイル形式（複数選択可）</b><label><input type="checkbox" name="fmt" value="xlsx" checked> Excel</label><label><input type="checkbox" name="fmt" value="docx"> Word</label><label><input type="checkbox" name="fmt" value="pptx"> PowerPoint</label><label><input type="checkbox" name="fmt" value="pdf"> PDF</label></div><div><b>生成件数</b><label><input type="radio" name="count" value="10" checked> 10件</label><label><input type="radio" name="count" value="30"> 30件</label><label><input type="radio" name="count" value="50"> 50件</label></div></div><button id="generate">テストドキュメントを生成</button><p class="note">TEST DATA ONLY — 実在する人物・企業・団体・製品とは関係ありません。</p></section><section id="resultPanel" hidden><div class="head"><h2>4. 生成結果 <span id="count"></span></h2><div><button id="all">全選択</button><button id="zip">選択をZIP</button></div></div><div id="results"></div></section></main><dialog id="preview"><button onclick="this.closest('dialog').close()">×</button><div id="previewBody"></div></dialog><footer>UTF-8 / GitHub Pages</footer><script src="js/app.js?v=1.0.3"></script></body></html>
